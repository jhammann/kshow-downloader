[project]
name = "kshow"
version = "0.1.0"
description = "Sonarr-like downloader for Korean TV shows"
requires-python = ">=3.12"
dependencies = [
    "apscheduler>=3,<4",
    "authlib>=1.9.1",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "itsdangerous>=2.2.0",
    "jinja2>=3.1.6",
    "pydantic-settings>=2.16.2",
    "python-multipart>=0.0.32",
    "selectolax>=1.0.2",
    "sqlalchemy>=2.1.6",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kshow"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = [
    "error",
    "ignore:Using `httpx` with `starlette.testclient`",
    "ignore::authlib.deprecate.AuthlibDeprecationWarning",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
    "respx>=0.23.1",
]
