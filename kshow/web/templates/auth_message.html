{% extends "_auth_base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="auth-box">
  <p class="logo logo-big"><img class="logo-mark" src="{{ static_url('icons/icon.svg') }}" alt="" width="28" height="28">k<b>show</b></p>
  <div class="card notice">
    <h1>{{ title }}</h1>
    <p class="muted">{{ message }}</p>
  </div>
  <a class="button {% if retry %}primary {% endif %}block big" href="/login">{% if retry %}Try again{% else %}Back to login{% endif %}</a>
</div>
{% endblock %}
