services:
  kshow:
    image: kshow-downloader:latest
    build: .
    container_name: kshow
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      PUID: "1001"
      PGID: "100"
      TZ: Europe/Amsterdam
      APP_URL: https://kshow.example.com
      QBIT_URL: http://<host>:8089
      QBIT_USERNAME: admin
      QBIT_PASSWORD: changeme
      TVDB_API_KEY: your-tvdb-api-key
      FLARESOLVERR_URL: http://<host>:8191
      # Pocket ID (omit OIDC_ISSUER to run without login, LAN only)
      OIDC_ISSUER: https://id.example.com
      OIDC_CLIENT_ID: kshow
      OIDC_CLIENT_SECRET: changeme
      OIDC_ALLOWED_GROUPS: kshow
      # APPRISE_URL: http://<host>:8000/notify/kshow
      # APPRISE_TAG: kshow
    volumes:
      - /nas/Config/kshow:/config
      - /nas/Media/TV:/tv
      - /nas/Downloads:/downloads
